                "@type": "Answer",
                "text": "SearchMind API is an enterprise AI-native search and browser execution engine designed specifically for LLM pipelines, autonomous agents, and RAG architectures. It provides multi-provider web search, passage highlights, schema-driven JSON entity extraction, zero-crawl topological site mapping, and persistent stateful browser sessions."

                "@type": "Answer",
                "text": "Unlike Tavily (which focuses solely on search snippets) or Firecrawl (which specializes primarily in scraping and markdown conversion), SearchMind combines multi-provider resilient search, zero-crawl sitemap discovery, deterministic JSON Schema extraction with self-repair, persistent browser session leasing with cookie vaults, and natural language ARIA-grounded browser actions in a single unified API with sub-250ms p95 latency."

              "@type": "Question",
              "name": "What is Schema-Driven Extraction in SearchMind?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Schema-Driven Extraction (`POST /v1/extract/schema`) allows developers to provide an arbitrary JSON Schema specification alongside a URL. SearchMind extracts and validates structured entities conforming exactly to that schema, eliminating downstream LLM parsing tokens and schema drift."
              }
            },

              "@type": "Question",

              "acceptedAnswer": {
                "@type": "Answer",
                "text": "SearchMind provides stateful browser sessions (`POST /v1/sessions`) where headless Playwright contexts are retained in memory. Developers can inject authenticated session cookies into the cookie vault, navigate complex single-page apps, and execute sequential actions without losing session state."
